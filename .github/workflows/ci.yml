# CI: backend build + tests; mobile install + jest (pass-with-no-tests).
# Lint is intentionally omitted until ESLint debt is cleared — every job here must pass.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: "0"
    defaults:
      run:
        working-directory: workout-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: workout-backend/yarn.lock

      # Lock Yarn 1.x (yarn.lock format v1). Some runners ship Yarn 4 via Corepack as `yarn`, which breaks installs here.
      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22 && yarn --version

      # bcrypt / node-gyp builds need a compiler on clean Ubuntu runners
      - name: Install native build toolchain
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test --passWithNoTests

      - name: E2E tests
        run: yarn test:e2e

  mobile:
    name: Mobile — test
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: "0"
    defaults:
      run:
        working-directory: workout-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: workout-mobile/yarn.lock

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22 && yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Tests
        run: yarn test --passWithNoTests
